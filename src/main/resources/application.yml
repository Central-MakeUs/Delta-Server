spring:
  profiles:
    active: local # 기본값
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: true
    show-sql: false
    generate-ddl: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 워커 executor(ocr 8 + ai 5 + purge 4)와 스케줄러 스레드가 동시에 커넥션을 잡으므로
  # 기본값 10으로는 웹 요청이 커넥션을 못 얻는다. open-in-view=true라 요청당 점유 시간도 길다.
  # 워커는 외부 호출 구간에서 커넥션을 놓으므로 스레드 총합보다는 적게 잡아도 된다.
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 3000

  # 기본값 1이면 @Scheduled 워커 8개가 한 스레드에서 직렬로 돌아
  # OCR 배치가 끝날 때까지 AI/리포트 워커가 전부 밀린다. 스케줄러 수(8)보다 넉넉하게 잡는다.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:10}

  # Redis 공통 설정
  data:
    redis:
      port: 6379
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: false
      timeout: 2s

# 공통 비즈니스 설정
storage:
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION:ap-northeast-2}
    key-prefix: ${S3_KEY_PREFIX:delta}
    presign-get-ttl-seconds: ${S3_PRESIGN_GET_TTL_SECONDS:600}
    max-upload-bytes: ${S3_MAX_UPLOAD_BYTES:10485760}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    connect-timeout-ms: 2000
    read-timeout-ms: 4000
  apple:
    client-id: ${APPLE_CLIENT_ID}
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    redirect-uri: ${APPLE_REDIRECT_URI}
    private-key: ${APPLE_PRIVATE_KEY_PEM}
    connect-timeout-ms: 2000
    read-timeout-ms: 4000
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
    connect-timeout-ms: 2000
    read-timeout-ms: 4000

worker:
  # 스캔 워커는 전부 외부 API 대기가 대부분인 I/O 바운드라 코어 수보다 크게 잡는다.
  # batch-size는 concurrency의 2배로 두어 한 tick에 풀이 놀지 않게 한다.
  ocr:
    fixed-delay-ms: ${WORKER_OCR_FIXED_DELAY_MS:1000}
    batch-size: ${WORKER_OCR_BATCH_SIZE:16}
    lock-lease-seconds: ${WORKER_OCR_LOCK_LEASE_SECONDS:600}
    concurrency: ${WORKER_OCR_CONCURRENCY:8}
    backlog-log-minutes: ${WORKER_OCR_BACKLOG_LOG_MINUTES:7}

  # Gemini 레이트 리밋(429)을 이미 맞고 있어 동시성을 과하게 올리면 실패만 늘어난다.
  ai:
    fixed-delay-ms: ${WORKER_AI_FIXED_DELAY_MS:500}
    batch-size: ${WORKER_AI_BATCH_SIZE:10}
    lock-lease-seconds: ${WORKER_AI_LOCK_LEASE_SECONDS:600}
    concurrency: ${WORKER_AI_CONCURRENCY:5}
    backlog-log-minutes: ${WORKER_AI_BACKLOG_LOG_MINUTES:7}

  ai-solution:
    fixed-delay-ms: ${WORKER_AI_SOLUTION_FIXED_DELAY_MS:500}
    batch-size: ${WORKER_AI_SOLUTION_BATCH_SIZE:3}

  report:
    fixed-delay-ms: ${WORKER_REPORT_FIXED_DELAY_MS:1000}
    batch-size: ${WORKER_REPORT_BATCH_SIZE:2}

  # 1시간에 한 번만 돌므로 batch가 작으면 스캔 증가분을 못 따라가 백로그가 쌓인다.
  # lock-lease는 S3 삭제가 배치 내내 이어져도 만료되지 않도록 넉넉히 둔다.
  purge:
    fixed-delay-ms: ${WORKER_PURGE_FIXED_DELAY_MS:3600000}
    batch-size: ${WORKER_PURGE_BATCH_SIZE:30}
    lock-lease-seconds: ${WORKER_PURGE_LOCK_LEASE_SECONDS:600}
    concurrency: ${WORKER_PURGE_CONCURRENCY:4}
    backlog-log-minutes: ${WORKER_PURGE_BACKLOG_LOG_MINUTES:60}
    retention-days: ${WORKER_PURGE_RETENTION_DAYS:3}

  user-purge:
    fixed-delay-ms: ${WORKER_USER_PURGE_FIXED_DELAY_MS:3600000}
    batch-size: ${WORKER_USER_PURGE_BATCH_SIZE:50}
    retention-days: ${WORKER_USER_PURGE_RETENTION_DAYS:7}

jwt:
  issuer: cmc-delta
  secret-base64: ${JWT_SECRET_BASE64}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:7200}
  blacklist:
    enabled: true

mathpix:
  base-url: https://api.mathpix.com
  app-id: ${MATHPIX_APP_ID}
  app-key: ${MATHPIX_APP_KEY}

gemini:
  base-url: https://generativelanguage.googleapis.com
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  solve-model: ${GEMINI_SOLVE_MODEL:gemini-3.1-flash-lite}
  report-model: ${GEMINI_REPORT_MODEL:gemini-3.1-flash-lite}

openai:
  base-url: https://api.openai.com
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  solve-model: ${OPENAI_SOLVE_MODEL:${OPENAI_MODEL:gpt-4o-mini}}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} traceId=%X{traceId} - %msg%n"
  level:
    cmc.delta: INFO

management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: never
  metrics:
    tags:
      application: delta-backend

discord:
  webhook:
    bot_toekn_url: ${DISCORD_BOT_TOKEN}
    bot_token_stats: ${DISCORD_BOT_TOKEN_STATS}

stats:
  daily:
    cron: ${STATS_DAILY_CRON:0 59 23 * * *}
